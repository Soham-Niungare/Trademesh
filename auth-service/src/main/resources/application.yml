server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trademesh_db}
    username: ${DB_USER:trademesh}
    password: ${DB_PASSWORD:trademesh}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: auth
        format_sql: true
    open-in-view: false

trademesh:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

logging:
  level:
    com.trademesh: INFO
