server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/auth/**
        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:8082}
          predicates:
            - Path=/orders/**
        - id: market-data-service
          uri: http://${MARKET_DATA_HOST:localhost}:${MARKET_DATA_PORT:8083}
          predicates:
            - Path=/market/**
        - id: portfolio-service
          uri: http://${PORTFOLIO_SERVICE_HOST:localhost}:${PORTFOLIO_SERVICE_PORT:8084}
          predicates:
            - Path=/portfolio/**

logging:
  level:
    com.trademesh: INFO
    org.springframework.cloud.gateway: INFO
