spring:
  application:
    name: trademesh-backend

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  datasource:
    # Externalized on the same ${VAR:default} pattern as Redis, JWT and CORS
    # below. The defaults reproduce the previously-hardcoded values exactly, so
    # local dev against the docker-compose Postgres keeps working with no env
    # vars set. DB_PASSWORD must come from a Secret in any real environment --
    # the default here is the local compose credential, not a shared one.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trademesh}
    username: ${DB_USERNAME:trademesh}
    password: ${DB_PASSWORD:trademesh}
    # Not externalized: the driver is a property of the dependency on the
    # classpath, not of the environment the app runs in.
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  autoconfigure:
    exclude:
      # Security is fully custom (stateless JWT only, no httpBasic/formLogin) --
      # without this, Boot still stands up a pointless default in-memory user
      # with a random generated password on every startup, since it sees no
      # UserDetailsService/AuthenticationProvider/AuthenticationManager bean.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt:
  # Dev-only default (>= 32 bytes, required for HS256) -- override via JWT_SECRET in any real environment.
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-deployment-please}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour

cors:
  # Origins allowed to call /api/** from a browser (see CorsConfig). Defaults to
  # the local Next.js dev server; override with CORS_ALLOWED_ORIGINS (comma-separated)
  # to point at a deployed frontend without rebuilding.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
