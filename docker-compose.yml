services:
  postgres:
    image: postgres:16-alpine
    container_name: trademesh-postgres
    environment:
      POSTGRES_DB: trademesh
      POSTGRES_USER: trademesh
      POSTGRES_PASSWORD: trademesh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademesh -d trademesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trademesh-redis
    ports:
      - "6379:6379"
    # No volume: Redis here is a derived, fully rebuildable market-data
    # projection (see docs/architecture.md), never a source of truth --
    # losing it on restart is fine, OrderBookWarmupRunner rebuilds it from
    # Postgres on every boot.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
