# ClusterIP, internal only and never routed through the Ingress. The backend
# resolves this as `redis:6379` via REDIS_HOST/REDIS_PORT in backend-config.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: trademesh
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: trademesh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: trademesh
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
