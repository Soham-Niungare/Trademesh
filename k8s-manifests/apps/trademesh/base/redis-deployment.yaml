apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: trademesh
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: trademesh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: trademesh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: trademesh
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          # ===================================================================
          # NO PERSISTENT VOLUME. This is deliberate, not an omission.
          #
          # Redis here holds a derived market-data projection -- an aggregated
          # order-book snapshot per symbol -- and is never a source of truth.
          # Postgres is. On every startup OrderBookWarmupRunner rebuilds the
          # projection from the database, so an empty Redis after a restart is
          # a normal, self-correcting state rather than data loss.
          #
          # The application is also explicitly tolerant of Redis being
          # unreachable: writes are fire-and-forget, and trading continues
          # (proven by MarketDataResilienceTest). Attaching a PVC would add a
          # storage dependency and a failure mode in exchange for nothing.
          #
          # See docs/market-data.md and docs/architecture.md.
          # ===================================================================
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
