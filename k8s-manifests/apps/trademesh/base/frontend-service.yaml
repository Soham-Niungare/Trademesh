# ClusterIP: external traffic arrives through the Ingress, which targets this
# Service. Not exposed directly.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: trademesh
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: trademesh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: trademesh
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
